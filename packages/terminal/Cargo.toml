[package]
name = "daruda_terminal"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false
license.workspace = true

[lints]
workspace = true

[features]
test-support = []

[dependencies]
base64 = { workspace = true }
daruda_core = { workspace = true }
daruda_store = { workspace = true }
dirs = { workspace = true }
ghostty_vt = { workspace = true }
gpui = { workspace = true }
portable-pty = { workspace = true }
regex = { workspace = true }
rust-i18n = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tracing = { workspace = true }
unicode-width = { workspace = true }

[dev-dependencies]
daruda_core = { workspace = true, features = ["test-support"] }
# Its own stub on, as `cargo test` links it into the app binary.
daruda_terminal = { workspace = true, features = ["test-support"] }
gpui = { workspace = true, features = ["test-support"] }
criterion = { version = "0.8", features = ["html_reports"] }
tempfile = { workspace = true }

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { workspace = true, features = ["Win32_System_Console", "Win32_Foundation"] }

[[bench]]
name = "render"
harness = false

[package]
name = "daruda_project"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false
license.workspace = true
description = "Runtime project and lane model for daruda — worktree/git operations and session-host resolution (GPUI-free)"

[lints]
workspace = true

[features]
# `FakeGit` and the isolated git config, for crates whose tests must not
# spawn git or read the developer's own config. Never a shipping default.
test-support = ["dep:libc"]

[dependencies]
daruda_config = { workspace = true }
daruda_core = { workspace = true }
daruda_store = { workspace = true }
which = { workspace = true }

# Only the isolated test git config reads the effective uid.
[target.'cfg(unix)'.dependencies]
libc = { workspace = true, optional = true }

[dev-dependencies]
daruda_project = { workspace = true, features = ["test-support"] }
serde_json = { workspace = true }
shell-words = { workspace = true }
tempfile = { workspace = true }

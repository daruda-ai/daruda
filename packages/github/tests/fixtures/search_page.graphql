query($q: String!, $first: Int!, $after: String) { search(query: $q, type: ISSUE, first: $first, after: $after) { issueCount pageInfo { hasNextPage endCursor } nodes { ... on PullRequest { ...pr repository { nameWithOwner } headRepositoryOwner { login } author { login } baseRefName comments { totalCount } } } } } fragment pr on PullRequest { number url title state isDraft headRefName isCrossRepository reviewDecision updatedAt statusCheckRollup { state contexts(first: 100) { pageInfo { hasNextPage } nodes { __typename ... on CheckRun { name status conclusion detailsUrl startedAt completedAt checkSuite { workflowRun { event workflow { name } } } } ... on StatusContext { context state targetUrl createdAt } } } } }
